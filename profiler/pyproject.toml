[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kotone-profiler"
version = "1.1.1"
description = "Offline personal voice profiler and DSP parameter optimizer for Kotone (琴音) OBS Audio Filter"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
fast = ["numpy>=1.26"]

[project.scripts]
kotone-profiler = "kotone_profiler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kotone_profiler*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["kotone_profiler", "conftest"]
